on:
  workflow_call:
    secrets:
      AZURE_TENANT_ID:
        required: true
        description: 'Azure Tenant ID'
      AZURE_CLIENT_ID:
        required: true
        description: 'Azure Client ID'
      AZURE_SUBSCRIPTION_ID:
        required: true
        description: 'Azure Subscription ID'

    inputs:
      environment:
        type: string
        required: true
        description: 'environment to deploy to'
      apiName:
        type: string
        required: true
        description: 'API name to import'
      apiPath:
        type: string
        required: true
        description: 'API path to import, without the leading /'
      openApiSpecPath:
        type: string
        required: true
        description: 'Specification path to import, without the leading /'
      usesCiamLogin:
        type: boolean
        required: false
        description: 'Does the API use the CIAM endpoint'
        default: false
      enable-openapi-prefix-in-server-url:
        type: boolean
        required: false
        description: 'Whether the OpenAPI server URL already includes the API path prefix'
        default: false
      resourceUriNamedValue:
        type: string
        required: false
        description: 'Override the named value used for the resource URI in the APIM policy. If not set, defaults to resource-uri-{apiId}.'
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  import_api_CD:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          repository: Uniphar/shared-workflows
          path: shared-workflows
          ref: fix/prep-named-value

      - name: azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Import API into APIM
        uses: azure/powershell@v2
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_API_NAME: ${{ inputs.apiName }}
          INPUT_API_PATH: ${{ inputs.apiPath }}
          INPUT_OPENAPI_SPEC_PATH: ${{ inputs.openApiSpecPath }}
          INPUT_USES_CIAM_LOGIN: ${{ inputs.usesCiamLogin }}
          INPUT_ENABLE_OPENAPI_PREFIX_IN_SERVER_URL: ${{ inputs['enable-openapi-prefix-in-server-url'] }}
          INPUT_RESOURCE_URI_NAMED_VALUE: ${{ inputs.resourceUriNamedValue }}
        with:
          inlineScript: |
            . ./shared-workflows/utilities/Import-UniApimApi.ps1
            $usesCiamLogin = [System.Convert]::ToBoolean($env:INPUT_USES_CIAM_LOGIN)
            $enableOpenApiPrefixInServerUrl = [System.Convert]::ToBoolean($env:INPUT_ENABLE_OPENAPI_PREFIX_IN_SERVER_URL)

            Import-UniApimApi $env:INPUT_ENVIRONMENT $env:INPUT_API_NAME $env:INPUT_API_PATH $env:INPUT_OPENAPI_SPEC_PATH $usesCiamLogin $enableOpenApiPrefixInServerUrl $env:INPUT_RESOURCE_URI_NAMED_VALUE -Verbose -ErrorAction Stop
          azPSVersion: "latest"
          errorActionPreference: 'stop'
          failOnStandardError: true
